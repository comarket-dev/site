<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css">
<style>
  /* The video frame: her screenshot as the green-screen background, Lena keyed over it, captions burned in */
  body { width: 360px; height: 640px; background: #09090d; }
  .bg { position: absolute; inset: 0; background: url(../build/lena-page.jpg) center 64% / 100% auto no-repeat; }
  .me { position: absolute; left: 38px; bottom: -32px; width: 278px; }
  .cap { position: absolute; left: 0; right: 0; top: 192px; display: grid; justify-items: center; gap: 2px; }
  .cap span { font: 700 17px/1.18 'TikTok Sans', -apple-system, sans-serif; color: #111; background: #fff; padding: 4px 9px 5px; border-radius: 7px; }
</style></head>
<body>
  <div class="bg"></div>
  <div class="cap"><span>shipped my waitlist page</span><span>before my coffee got cold</span></div>
  <img class="me" src="../keys/lena-key.png" alt="">
</body></html>
