<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css">
<style>
  /* June's thumbnail: a frame from the video (her at the café's standing desk, painting), darkened on the right for
     the words and the app's timer, stacked so they stay clear of her head */
  body { width: 640px; height: 360px; background: #1b140e; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url(../../content/real/june-dah-cafepainting.jpg) 12% 40% / cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 8, 6, 0) 30%, rgba(10, 8, 6, 0.62) 62%, rgba(10, 8, 6, 0.78) 100%); }
  .timer { position: absolute; right: 24px; top: 186px; width: 236px; padding: 15px 17px; border-radius: 18px; background: rgba(15, 76, 92, 0.95); color: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.45); transform: rotate(3deg); }
  .timer header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; opacity: .85; }
  .timer header svg { width: 16px; height: 16px; }
  .timer b { display: block; font: 600 46px/1 -apple-system, system-ui; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 8px; }
  .timer small { display: block; font-size: 12px; opacity: .78; margin-top: 4px; }
  .timer .row { display: flex; gap: 6px; margin-top: 12px; }
  .timer .row span { font-size: 10.5px; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.14); text-decoration: line-through; opacity: .85; }
  .words { position: absolute; right: 28px; top: 14px; text-align: right; font: 400 84px/0.86 Anton, sans-serif; color: #fff; letter-spacing: 0.005em; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .words em { font-style: normal; color: #ffd166; }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="words">PHONE<br><em>JAIL</em></div>
  <div class="timer">
    <header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14A8 8 0 1 1 10 5a6 6 0 0 0 9 9Z"/></svg>Quietly · Deep work</header>
    <b>3:58:12</b>
    <small>left today · 27 apps blocked</small>
    <div class="row"><span>Instagram</span><span>Mail</span><span>Slack</span></div>
  </div>
</body></html>
