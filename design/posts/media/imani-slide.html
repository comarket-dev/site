<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css">
<style>
  /* Slide 1 of Imani's carousel: her at the mirror, hearing aids going in after the cream, with the cover text she set
     in-app. The products are on the later slides and on Kindred's storefront, so the post and the storefront don't
     repeat the same photo. */
  body { width: 360px; height: 450px; background: #e8e1d6; }
  .photo { position: absolute; inset: 0; background: url(../../content/real/imani-dah-hearingaidmirror.jpg) 46% center / cover; }
  /* the window behind her is bright, so the cover text is set dark */
  .cover { position: absolute; left: 20px; top: 22px; color: #2a1c14; text-shadow: 0 1px 12px rgba(255, 248, 240, 0.7); }
  .cover b { display: block; font: 600 31px/1.02 ui-serif, 'New York', Georgia, serif; letter-spacing: -0.01em; }
  .cover b i { font-style: italic; font-weight: 500; }
  .cover span { display: inline-block; margin-top: 9px; font: 600 11.5px/1 -apple-system, system-ui; color: #3a2a20; background: rgba(255, 250, 244, 0.88); padding: 5px 9px; border-radius: 999px; }
</style></head>
<body>
  <div class="photo"></div>
  <div class="cover"><b>my 3-step<br><i>barrier reset</i></b><span>cream first, aids last</span></div>
</body></html>
