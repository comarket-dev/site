<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css">
<style>
  /* Jonah's thumbnail: his own desk, blurred and darkened, as the background; him in front; the app; two words */
  body { width: 640px; height: 360px; background: #1b140e; overflow: hidden; }
  .bg { position: absolute; inset: -30px; background: url(../../content/real/jonah-18935828.jpg) 50% 45% / cover; filter: blur(14px) brightness(.55) saturate(1.15); }
  .glow { position: absolute; inset: 0; background: radial-gradient(60% 80% at 75% 40%, rgba(255, 190, 110, .28), rgba(0,0,0,0) 70%); }
  .timer { position: absolute; left: 36px; top: 150px; width: 250px; padding: 16px 18px; border-radius: 18px; background: rgba(15, 76, 92, 0.94); color: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.45); transform: rotate(-3deg); }
  .timer header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; opacity: .85; }
  .timer header svg { width: 16px; height: 16px; }
  .timer b { display: block; font: 600 48px/1 -apple-system, system-ui; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 8px; }
  .timer small { display: block; font-size: 12px; opacity: .78; margin-top: 4px; }
  .timer .row { display: flex; gap: 6px; margin-top: 12px; }
  .timer .row span { font-size: 10.5px; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.14); text-decoration: line-through; opacity: .85; }
  .words { position: absolute; left: 30px; top: 22px; font: 400 92px/0.9 Anton, sans-serif; color: #fff; letter-spacing: 0.005em; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .words em { font-style: normal; color: #ffd166; }
  .me { position: absolute; right: -54px; bottom: -40px; height: 400px; filter: drop-shadow(0 16px 30px rgba(0,0,0,.55)); }
</style></head>
<body>
  <div class="bg"></div><div class="glow"></div>
  <div class="words">PHONE <em>JAIL</em></div>
  <div class="timer">
    <header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14A8 8 0 1 1 10 5a6 6 0 0 0 9 9Z"/></svg>Quietly · Deep work</header>
    <b>3:58:12</b>
    <small>left today · 27 apps blocked</small>
    <div class="row"><span>Instagram</span><span>Mail</span><span>Slack</span></div>
  </div>
  <img class="me" src="../keys/jonah-key.png" alt="">
</body></html>
