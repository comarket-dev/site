<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css">
<style>
  /* A frame of Alma's slow-morning video: her tea by the window, captions burned in. The photo is design/content/real
     (design/content/real-creators.json), cropped to her side of the table; the box she's talking about is in the
     captions, not on camera. */
  body { width: 360px; height: 640px; background: #2a2118; }
  .photo { position: absolute; inset: 0; background: url(../../content/real/alma-dah-datelighting.jpg) 24% 50% / cover no-repeat; }
  /* TikTok's dark text box: the window behind her is bright, so plain white captions wouldn't read */
  .caps { position: absolute; left: 0; right: 0; top: 92px; display: grid; justify-items: center; gap: 3px; }
  .cap { font: 700 17px/1.18 'TikTok Sans', -apple-system, sans-serif; color: #fff; background: rgba(0, 0, 0, 0.72); padding: 4px 9px 5px; border-radius: 7px; }
  .c2 { font-size: 14px; }
</style></head>
<body>
  <div class="photo"></div>
  <div class="caps"><span class="cap c1">slow morning, week 32</span><span class="cap c2">this month's box: smoky oolong</span></div>
</body></html>
